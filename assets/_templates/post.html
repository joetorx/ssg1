{% extends "base.html" %}
{% block title %}{{ post.title }}{% endblock %}
{% block content %}
<article>
    <h2>{{ post.title }}</h2>
    <div id="post-header">
    <time datetime="{{ post.datetime }}"><em>{{ post.datetime_visual }}</em></time>
    </div>
    <div id="post-content">
    {{ post.html }}
    </div>
</article>
{% endblock %}
